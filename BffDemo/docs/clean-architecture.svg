<svg viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ttl desc" font-family="var(--font-voice), 'Segoe UI', system-ui, sans-serif">
  <title id="ttl">Clean Architecture do BFF</title>
  <desc id="desc">Camadas concêntricas: Domain no centro, envolvido por Application, Infrastructure e API na borda. As dependências apontam sempre para dentro.</desc>
  <style>
    :root{
      --txt:#1a1a1f; --txt2:#5c5c66; --panel:#f6f6f8; --border:#d9d9df;
      --d:#2f9e44; --a:#1c7ed6; --i:#e8930c; --p:#e03131;
      --d-fill:#e7f5ec; --a-fill:#e4eefb; --i-fill:#fbeed6; --p-fill:#fbe6e6;
    }
    @media (prefers-color-scheme: dark){
      :root{
        --txt:#f0f0f4; --txt2:#a9a9b4; --panel:#26262c; --border:#3a3a44;
        --d-fill:#12321f; --a-fill:#102843; --i-fill:#3a2a08; --p-fill:#3a1616;
      }
    }
    :root[data-theme="dark"]{
      --txt:#f0f0f4; --txt2:#a9a9b4; --panel:#26262c; --border:#3a3a44;
      --d-fill:#12321f; --a-fill:#102843; --i-fill:#3a2a08; --p-fill:#3a1616;
    }
    :root[data-theme="light"]{
      --txt:#1a1a1f; --txt2:#5c5c66; --panel:#f6f6f8; --border:#d9d9df;
      --d-fill:#e7f5ec; --a-fill:#e4eefb; --i-fill:#fbeed6; --p-fill:#fbe6e6;
    }
    .t1{font-size:22px;font-weight:700;fill:var(--txt)}
    .t2{font-size:13px;fill:var(--txt2)}
    .lbl{font-size:15px;font-weight:700}
    .dom{font-size:16px;font-weight:700;fill:var(--d)}
    .domsub{font-size:11.5px;fill:var(--txt)}
    .cardt{font-size:15px;font-weight:700}
    .cardl{font-size:12.5px;fill:var(--txt)}
    .cardm{font-size:12px;fill:var(--txt2)}
    .foot{font-size:12px;fill:var(--txt2)}
    .arw{stroke:var(--txt2);stroke-width:2;fill:none}
  </style>

  <defs>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="var(--txt2)"/>
    </marker>
  </defs>

  <!-- Header -->
  <text x="40" y="40" class="t1">Clean Architecture — BFF (ASP.NET Core 8)</text>
  <text x="40" y="63" class="t2">Cada camada só depende das camadas mais internas. O Domain é o centro e não conhece ninguém.</text>

  <!-- Concentric layers -->
  <rect x="100" y="150" width="460" height="410" rx="12" fill="var(--p-fill)" stroke="var(--p)" stroke-width="2"/>
  <rect x="150" y="196" width="360" height="318" rx="11" fill="var(--i-fill)" stroke="var(--i)" stroke-width="2"/>
  <rect x="200" y="242" width="260" height="226" rx="10" fill="var(--a-fill)" stroke="var(--a)" stroke-width="2"/>
  <rect x="250" y="300" width="160" height="110" rx="10" fill="var(--d-fill)" stroke="var(--d)" stroke-width="2.5"/>

  <!-- Layer labels -->
  <text x="330" y="176" text-anchor="middle" class="lbl" fill="var(--p)">API · Apresentação</text>
  <text x="330" y="221" text-anchor="middle" class="lbl" fill="var(--i)">Infrastructure</text>
  <text x="330" y="266" text-anchor="middle" class="lbl" fill="var(--a)">Application</text>
  <text x="330" y="350" text-anchor="middle" class="dom">Domain</text>
  <text x="330" y="368" text-anchor="middle" class="domsub">regras de negócio</text>

  <!-- Inward dependency arrows (each outer depends on inner) -->
  <line x1="112" y1="478" x2="146" y2="478" class="arw" marker-end="url(#ah)"/>
  <line x1="162" y1="436" x2="196" y2="436" class="arw" marker-end="url(#ah)"/>
  <line x1="210" y1="392" x2="246" y2="392" class="arw" marker-end="url(#ah)"/>
  <text x="112" y="540" class="t2">➜ &quot;depende de&quot; — a seta aponta sempre para dentro</text>

  <!-- Explanation cards -->
  <!-- Card 1: Domain -->
  <rect x="600" y="150" width="380" height="95" rx="10" fill="var(--panel)" stroke="var(--border)"/>
  <rect x="600" y="160" width="5" height="75" fill="var(--d)"/>
  <text x="622" y="180" class="cardt" fill="var(--d)">Domain — o núcleo</text>
  <text x="622" y="203" class="cardl">Entidade Endereco e suas regras puras (Formatar()).</text>
  <text x="622" y="224" class="cardm">Conhece: nada externo. Sem HTTP, sem MediatR, sem framework.</text>

  <!-- Card 2: Application -->
  <rect x="600" y="257" width="380" height="95" rx="10" fill="var(--panel)" stroke="var(--border)"/>
  <rect x="600" y="267" width="5" height="75" fill="var(--a)"/>
  <text x="622" y="287" class="cardt" fill="var(--a)">Application — casos de uso</text>
  <text x="622" y="310" class="cardl">Handlers, ports (IEnderecoProvider), DTOs, validators, behaviors.</text>
  <text x="622" y="331" class="cardm">Conhece: só o Domain. Define interfaces, não implementa I/O.</text>

  <!-- Card 3: Infrastructure -->
  <rect x="600" y="364" width="380" height="95" rx="10" fill="var(--panel)" stroke="var(--border)"/>
  <rect x="600" y="374" width="5" height="75" fill="var(--i)"/>
  <text x="622" y="394" class="cardt" fill="var(--i)">Infrastructure — detalhes</text>
  <text x="622" y="417" class="cardl">BrasilApiClient implementa a port via HttpClient.</text>
  <text x="622" y="438" class="cardm">Conhece: Application + HTTP. É a borda substituível.</text>

  <!-- Card 4: API -->
  <rect x="600" y="471" width="380" height="95" rx="10" fill="var(--panel)" stroke="var(--border)"/>
  <rect x="600" y="481" width="5" height="75" fill="var(--p)"/>
  <text x="622" y="501" class="cardt" fill="var(--p)">API — apresentação / composição</text>
  <text x="622" y="524" class="cardl">Controllers finos + Program.cs (composition root).</text>
  <text x="622" y="545" class="cardm">Conhece: todas as camadas — apenas para montá-las na DI.</text>

  <!-- Footer -->
  <text x="40" y="598" class="foot">Regra da Dependência: o código aponta sempre para dentro — trocar a BrasilAPI por ViaCEP não afeta Domain nem Application.</text>
</svg>
